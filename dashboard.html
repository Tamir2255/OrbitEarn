<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earner Dashboard - AfriAd Earn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { orange: '#FF5A00', green: '#00B25C', dark: '#0F172A', slate: '#1E293B' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <header class="sticky top-0 z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold tracking-tight text-white">Afri<span class="text-brand-green">Earn</span></a>
            <div class="flex items-center gap-4">
                <span id="welcome-user-text" class="text-sm text-slate-400 hidden sm:inline">Loading...</span>
                <button onclick="handleLogOut()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-xl border border-slate-700 transition-all">Log Out</button>
            </div>
        </div>
    </header>

    <main class="flex-1 py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">

            <div>
                <h1 class="text-3xl font-extrabold text-white">Earner Dashboard</h1>
                <p class="text-slate-400 text-sm">Complete tasks below to earn instantly, or check on pending social approvals.</p>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-5 gap-4" id="wallet-cards"></div>

            <div class="grid lg:grid-cols-12 gap-8 items-start">

                <div class="lg:col-span-7 space-y-6">
                    <div class="bg-slate-800/40 rounded-3xl border border-slate-800 overflow-hidden">
                        <div class="flex border-b border-slate-800">
                            <button class="task-tab flex-1 py-4 text-sm font-bold text-white bg-slate-800" data-type="video" onclick="switchTab('video')">📺 Videos</button>
                            <button class="task-tab flex-1 py-4 text-sm font-bold text-slate-400" data-type="banner" onclick="switchTab('banner')">🌐 Banners</button>
                            <button class="task-tab flex-1 py-4 text-sm font-bold text-slate-400" data-type="social" onclick="switchTab('social')">📱 Social</button>
                        </div>
                        <div class="p-6 space-y-4" id="task-feed">
                            <p class="text-sm text-slate-500">Loading available tasks...</p>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-5 space-y-6">
                    <div class="bg-slate-800/40 p-6 rounded-3xl border border-slate-800 space-y-4">
                        <h2 class="text-lg font-bold text-white">Withdraw to Mobile Money</h2>
                        <div class="space-y-3">
                            <input type="number" id="withdraw-amount" placeholder="Amount" class="w-full h-11 bg-slate-900 border border-slate-700 rounded-lg px-3 text-white">
                            <select id="withdraw-currency" class="w-full h-11 bg-slate-900 border border-slate-700 rounded-lg px-3 text-white">
                                <option value="UGX">UGX (Uganda)</option>
                                <option value="KES">KES (Kenya)</option>
                                <option value="TZS">TZS (Tanzania)</option>
                                <option value="RWF">RWF (Rwanda)</option>
                                <option value="ZAR">ZAR (South Africa)</option>
                            </select>
                            <input type="text" id="withdraw-phone" placeholder="Phone Number" class="w-full h-11 bg-slate-900 border border-slate-700 rounded-lg px-3 text-white">
                            <button onclick="handleWithdraw()" class="w-full h-11 bg-brand-green hover:bg-green-600 text-white font-bold rounded-lg transition-all">Request Payout</button>
                        </div>
                    </div>

                    <div class="bg-slate-800/40 p-6 rounded-3xl border border-slate-800 space-y-4">
                        <h2 class="text-lg font-bold text-white">Recent Activity</h2>
                        <div class="space-y-3" id="task-history"><p class="text-sm text-slate-500">Loading...</p></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 py-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-500 text-sm"><p>&copy; 2026 AfriAd Technologies. All rights reserved.</p></div>
    </footer>

    <script>
        const API_BASE_URL = 'https://afriad-backend.onrender.com'; // <-- replace with your real Render service URL
        const CURRENCIES = ['UGX', 'KES', 'TZS', 'RWF', 'ZAR'];
        let currentUser = null;
        let activeTab = 'video';

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const storedUser = localStorage.getItem('user');
            if (!token || !storedUser) {
                alert('Please log in first.');
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(storedUser);
            if (currentUser.role !== 'earner') {
                alert('This dashboard is for earner accounts.');
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('welcome-user-text').innerText = `Welcome, ${currentUser.username}`;
            renderWalletCards();
            loadTasks(activeTab);
            loadHistory();
        });

        function handleLogOut() { localStorage.clear(); window.location.href = 'index.html'; }

        function renderWalletCards() {
            const container = document.getElementById('wallet-cards');
            container.innerHTML = CURRENCIES.map(cur => {
                const w = currentUser.wallets?.[cur] || { balance: 0, pending: 0 };
                return `
                    <div class="bg-slate-800/60 p-5 rounded-2xl border border-slate-800">
                        <span class="text-xs text-slate-400 uppercase font-semibold">${cur} Balance</span>
                        <div class="text-xl sm:text-2xl font-bold text-white mt-1">${Number(w.balance).toLocaleString()}</div>
                        <div class="text-xs text-yellow-400 mt-1">${Number(w.pending).toLocaleString()} pending</div>
                    </div>`;
            }).join('');
        }

        function switchTab(type) {
            activeTab = type;
            document.querySelectorAll('.task-tab').forEach(btn => {
                const isActive = btn.dataset.type === type;
                btn.className = `task-tab flex-1 py-4 text-sm font-bold ${isActive ? 'text-white bg-slate-800' : 'text-slate-400'}`;
            });
            loadTasks(type);
        }

        async function loadTasks(type) {
            const feed = document.getElementById('task-feed');
            feed.innerHTML = '<p class="text-sm text-slate-500">Loading available tasks...</p>';
            try {
                const response = await fetch(`${API_BASE_URL}/api/campaigns/available/${type}`);
                const data = await response.json();
                if (!response.ok || !data.campaigns.length) {
                    feed.innerHTML = '<p class="text-sm text-slate-500">No active campaigns right now — check back soon.</p>';
                    return;
                }
                feed.innerHTML = data.campaigns.map(c => renderTaskCard(type, c)).join('');
            } catch (err) {
                console.error(err);
                feed.innerHTML = '<p class="text-sm text-red-400">Failed to load tasks.</p>';
            }
        }

        function renderTaskCard(type, c) {
            if (type === 'video') {
                return `
                    <div class="p-4 bg-slate-900 rounded-xl border border-slate-800 space-y-3">
                        <div class="font-bold text-sm text-slate-200">${c.title}</div>
                        <video src="${c.media_url || ''}" class="w-full rounded-lg bg-black" controls muted></video>
                        <button onclick="completeVideo(${c.id}, this)" class="w-full h-10 bg-brand-green hover:bg-green-600 text-white font-bold rounded-lg text-sm">
                            Mark 30s Watched — Earn
                        </button>
                    </div>`;
            }
            if (type === 'banner') {
                return `
                    <div class="p-4 bg-slate-900 rounded-xl border border-slate-800 flex items-center justify-between gap-3">
                        <div>
                            <div class="font-bold text-sm text-slate-200">${c.title}</div>
                            <div class="text-xs text-slate-500">Publisher split: 60% of ${c.unit_cost} ${c.currency} per click</div>
                        </div>
                        <button onclick="completeClick(${c.id}, this)" class="h-10 px-4 bg-brand-green hover:bg-green-600 text-white font-bold rounded-lg text-sm whitespace-nowrap">Register Click</button>
                    </div>`;
            }
            return `
                <div class="p-4 bg-slate-900 rounded-xl border border-slate-800 space-y-3">
                    <div class="font-bold text-sm text-slate-200">${c.title}</div>
                    <div class="text-xs text-slate-500">Post the creative, then paste your live link below (65% split, pending admin review)</div>
                    <input type="url" id="proof-${c.id}" placeholder="https://instagram.com/p/..." class="w-full h-10 bg-slate-800 border border-slate-700 rounded-lg px-3 text-sm text-white">
                    <button onclick="submitSocialProof(${c.id})" class="w-full h-10 bg-brand-green hover:bg-green-600 text-white font-bold rounded-lg text-sm">Submit Proof</button>
                </div>`;
        }

        async function completeVideo(campaignId, btn) {
            btn.disabled = true;
            btn.innerText = 'Verifying...';
            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/verify-video`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ campaignId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(`Earned ${data.amountEarned} ${data.currency}!`);
                    bumpWalletBalance(data.currency, data.amountEarned, false);
                    loadTasks('video');
                    loadHistory();
                } else {
                    alert(data.error || 'Verification failed.');
                    btn.disabled = false;
                    btn.innerText = 'Mark 30s Watched — Earn';
                }
            } catch (err) {
                console.error(err);
                alert('Connection error.');
                btn.disabled = false;
            }
        }

        async function completeClick(campaignId, btn) {
            btn.disabled = true;
            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/register-click`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ campaignId })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(`Earned ${data.amountEarned} ${data.currency}!`);
                    bumpWalletBalance(data.currency, data.amountEarned, false);
                    loadTasks('banner');
                    loadHistory();
                } else {
                    alert(data.error || 'Click registration failed.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error.');
            } finally {
                btn.disabled = false;
            }
        }

        async function submitSocialProof(campaignId) {
            const input = document.getElementById(`proof-${campaignId}`);
            const proofUrl = input.value.trim();
            if (!proofUrl) { alert('Paste your live post URL first.'); return; }
            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/submit-social-proof`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ campaignId, proofUrl })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message);
                    loadTasks('social');
                    loadHistory();
                } else {
                    alert(data.error || 'Submission failed.');
                }
            } catch (err) {
                console.error(err);
                alert('Connection error.');
            }
        }

        function bumpWalletBalance(currency, amount, pending) {
            if (!currentUser.wallets[currency]) currentUser.wallets[currency] = { balance: 0, pending: 0 };
            if (pending) currentUser.wallets[currency].pending += Number(amount);
            else currentUser.wallets[currency].balance += Number(amount);
            localStorage.setItem('user', JSON.stringify(currentUser));
            renderWalletCards();
        }

        async function loadHistory() {
            const container = document.getElementById('task-history');
            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/mine`, {
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                const data = await response.json();
                if (!response.ok || !data.tasks.length) {
                    container.innerHTML = '<p class="text-sm text-slate-500">No activity yet.</p>';
                    return;
                }
                container.innerHTML = data.tasks.slice(0, 8).map(t => `
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-300 capitalize">${t.task_type} · ${Number(t.earner_amount).toLocaleString()} ${t.currency}</span>
                        <span class="px-2 py-0.5 ${t.status === 'approved' ? 'bg-green-500/20 text-green-400' : t.status === 'pending_approval' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-red-500/20 text-red-400'} text-xs font-semibold rounded-full">${t.status.replace('_', ' ')}</span>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-sm text-red-400">Failed to load activity.</p>';
            }
        }

        async function handleWithdraw() {
            const amount = document.getElementById('withdraw-amount').value;
            const currency = document.getElementById('withdraw-currency').value;
            const phoneNumber = document.getElementById('withdraw-phone').value;
            if (!amount || !phoneNumber) { alert('Please enter an amount and phone number.'); return; }

            try {
                const response = await fetch(`${API_BASE_URL}/api/payments/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ amount, currency, phoneNumber, network: 'MTN' })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message + '\nReference: ' + data.reference);
                    currentUser.wallets[currency].balance -= Number(amount);
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    renderWalletCards();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Request failed.');
            }
        }
    </script>
</body>
</html>
